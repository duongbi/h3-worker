name: Build & Deploy h3-worker

# Build image trên GitHub Actions rồi push lên ghcr.io.
# Nếu đã set secret RUNPOD_API_KEY + RUNPOD_TEMPLATE_ID, job deploy sẽ PATCH
# template trên RunPod sang image mới → RunPod tự rolling release endpoint.

# KHÔNG dùng bộ lọc `paths`. Nó im lặng bỏ qua push khi file thay đổi không
# khớp danh sách, và cách nó tính diff sau một rebase/merge rất khó đoán —
# ta đã mất một vòng debug vì tưởng CI hỏng trong khi nó chỉ đang bỏ qua.
# Build thừa vài phút rẻ hơn nhiều so với việc deploy nhầm image cũ.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'PATCH template trên RunPod sau khi push image'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}          # <user>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                            # cần để push lên ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      # Base image worker-comfyui NẶNG (~17GB với biến thể cuda12.8.1).
      # Runner GitHub mặc định chỉ còn ~25GB trống → phải dọn trước, nếu không
      # build sẽ chết giữa chừng với "no space left on device".
      - name: Giải phóng dung lượng đĩa
        run: |
          echo "Trước:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          echo "Sau:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # tự có, không cần tạo secret

      - name: Sinh tag & label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64                 # RunPod chỉ chạy amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false                      # tránh manifest lạ khi RunPod pull

      - name: Tóm tắt
        run: |
          echo "### Image đã push" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: PATCH template trên RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_TEMPLATE_ID" ]; then
            echo "::notice::Chưa set secret RUNPOD_API_KEY / RUNPOD_TEMPLATE_ID — bỏ qua bước deploy."
            exit 0
          fi
          # Dùng tag SHA ngắn, KHÔNG dùng :latest — để RunPod thấy image thực sự đổi
          # và biết chính xác worker đang chạy commit nào.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(git rev-parse --short HEAD)"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"   # ghcr chỉ nhận chữ thường
          echo "Deploy: $IMAGE"
          bash scripts/runpod_deploy.sh "$IMAGE"
